[package]
name = "editor"
description = "nge 示例：关卡编辑器（编辑平台跳跃的关卡，直接试玩）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nge-core.workspace = true
nge-ecs.workspace = true
nge-platform.workspace = true
nsh-core.workspace = true
# 试玩跑的就是平台跳跃的 Rust 系统，渲染、资源也是它的
platformer = { path = "../platformer" }

# 生成的宿主（nsh run / nsh package）里注册游戏视图用
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true
