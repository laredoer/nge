[package]
name = "sanguo"
description = "nge 示例：长坂坡（2.5D 横版清版动作，像素精灵和 3D 物件按纵深混排）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nge-core.workspace = true
nge-ecs.workspace = true
nge-assets.workspace = true
nge-audio.workspace = true
nge-render2d.workspace = true
nge-render3d.workspace = true
nge-scene.workspace = true
nge-text.workspace = true
nge-platform.workspace = true
nsh-core.workspace = true
# derive(Resource) 展开时需要 bevy_ecs 路径
bevy_ecs.workspace = true

# 生成的宿主（nsh run / nsh package）里注册游戏视图用
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true

[dev-dependencies]
serde_json.workspace = true
