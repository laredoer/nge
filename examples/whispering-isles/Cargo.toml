[package]
name = "whispering-isles"
description = "nge 示例：风语群岛（3D 开放世界探索，含起伏地形、滑翔伞、昼夜循环、PCSS 级联软阴影、3D 物理机关与圣坛发现）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nge-core.workspace = true
nge-ecs.workspace = true
nge-assets.workspace = true
nge-audio.workspace = true
nge-render2d.workspace = true
nge-render3d.workspace = true
nge-physics3d.workspace = true
nge-scene = { workspace = true, features = ["physics3d"] }
nge-text.workspace = true
nge-platform.workspace = true
nsh-core.workspace = true
bevy_ecs.workspace = true
serde.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true

[dev-dependencies]
serde_json.workspace = true
