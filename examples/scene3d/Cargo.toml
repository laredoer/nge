[package]
name = "scene3d"
description = "nge 示例：TSX 声明 3D 模型、文字、粒子"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nge-core.workspace = true
nge-ecs.workspace = true
nge-assets.workspace = true
nge-render2d.workspace = true
nge-render3d.workspace = true
nge-scene.workspace = true
nge-platform.workspace = true
nsh-core.workspace = true

# 生成的宿主（nsh run / nsh package）里注册游戏视图用
[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true

[dev-dependencies]
nge-particles.workspace = true
nge-text.workspace = true
serde_json.workspace = true
