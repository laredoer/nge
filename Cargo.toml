[package]
name = "nsh-app-nsh-game"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11"
serde_json = "1"
log = "0.4.35"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }
objc2-app-kit = { version = "0.3", features = ["NSView", "objc2-quartz-core"] }

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { version = "0.3.0", default-features = false }
nsh-engine = { version = "0.3.0", default-features = false }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIColor", "UIResponder", "UIScene", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UITraitCollection", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }

# macOS / iOS 共用的渲染引擎依赖
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = "30"
pollster = "1"
raw-window-handle = "0.6"
bytemuck = { version = "1.25.2", features = ["derive"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSObject", "NSString"] }
objc2-quartz-core = { version = "0.3", features = ["CADisplayLink", "CAFrameRateRange"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
