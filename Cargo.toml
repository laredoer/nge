[workspace]
resolver = "3"
members = ["crates/nge-core", "crates/nge-ecs", "crates/nge-platform", "crates/nge-render2d", "examples/bounce", "examples/sprites"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
nge-core = { path = "crates/nge-core" }
nge-platform = { path = "crates/nge-platform" }
nge-ecs = { path = "crates/nge-ecs" }
nge-render2d = { path = "crates/nge-render2d" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
glam = { version = "0.34", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nsh-core = "0.3.0"
nsh-base = "0.3.0"
nsh-engine = { version = "0.3.0", default-features = false }
nsh-platform-macos = { version = "0.3.0", default-features = false }
nsh-platform-ios = { version = "0.3.0", default-features = false }
wgpu = "30"
pollster = "1"
raw-window-handle = "0.6"
bytemuck = { version = "1.25", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSObject", "NSString", "NSThread"] }
objc2-quartz-core = { version = "0.3", features = ["CADisplayLink", "CAFrameRateRange"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "objc2-quartz-core"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIColor", "UIResponder", "UIScene", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UITraitCollection", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }
