[workspace]
resolver = "3"
members = ["crates/nge-assets", "crates/nge-audio", "crates/nge-core", "crates/nge-ecs", "crates/nge-nsh", "crates/nge-particles", "crates/nge-physics2d", "crates/nge-platform", "crates/nge-render2d", "crates/nge-render3d", "crates/nge-scene", "crates/nge-text", "examples/bounce", "examples/sprites", "examples/dodge", "examples/scene", "examples/model", "examples/effects", "examples/scene3d", "examples/physics", "examples/platformer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nge-assets = { path = "crates/nge-assets" }
nge-audio = { path = "crates/nge-audio" }
nge-core = { path = "crates/nge-core" }
nge-platform = { path = "crates/nge-platform" }
nge-ecs = { path = "crates/nge-ecs" }
nge-render2d = { path = "crates/nge-render2d" }
nge-render3d = { path = "crates/nge-render3d" }
nge-nsh = { path = "crates/nge-nsh" }
nge-particles = { path = "crates/nge-particles" }
nge-physics2d = { path = "crates/nge-physics2d" }
nge-scene = { path = "crates/nge-scene" }
nge-text = { path = "crates/nge-text" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std"] }
glam = { version = "0.34", features = ["bytemuck"] }
image = { version = "0.25", default-features = false, features = ["png"] }
nsh-core = "0.4.0"
nsh-base = "0.4.0"
nsh-engine = { version = "0.4.0", default-features = false }
nsh-platform-macos = { version = "0.4.0", default-features = false }
nsh-platform-ios = { version = "0.4.0", default-features = false }
wgpu = "30"
pollster = "1"
raw-window-handle = "0.6"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRunLoop", "NSObject", "NSString", "NSThread", "NSNotification", "NSOperation", "block2"] }
objc2-game-controller = { version = "0.3", features = ["GCController", "GCExtendedGamepad", "GCPhysicalInputProfile", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput", "GCControllerDirectionPad"] }
objc2-quartz-core = { version = "0.3", features = ["CADisplayLink", "CAFrameRateRange"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "objc2-quartz-core", "NSEvent", "NSResponder", "NSWindow", "NSText", "NSTextInputClient", "block2"] }
block2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIColor", "UIResponder", "UIScene", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UITraitCollection", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }

