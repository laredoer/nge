[package]
name = "nge-platform"
description = "NSH 游戏引擎平台层：把引擎挂成 NSH 原生组件（macOS NSView / iOS UIView / 浏览器 canvas）"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nge-core.workspace = true
serde_json.workspace = true
log.workspace = true
raw-window-handle.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-game-controller.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
objc2-app-kit.workspace = true
block2.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios.workspace = true
objc2-ui-kit.workspace = true
block2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
nsh-platform-web = { version = "0.4.0", default-features = false }
nge-assets.workspace = true
nge-audio.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "Navigator", "EventTarget", "Event", "CustomEvent", "CustomEventInit", "Response", "Headers", "KeyboardEvent", "PointerEvent"] }
