[package]
name = "nge-platform"
description = "NSH 游戏引擎平台层：把引擎挂成 NSH 原生组件（macOS NSView / iOS UIView）"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
nge-core.workspace = true
serde_json.workspace = true
log.workspace = true
raw-window-handle.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-quartz-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos.workspace = true
objc2-app-kit.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-platform-ios.workspace = true
objc2-ui-kit.workspace = true

[features]
# 自写 dev host（`macos::dev_host`），配合 `nsh dev --server-only` 热更新 TSX
dev = ["nsh-platform-macos/dev"]
