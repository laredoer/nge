[package]
name = "nge-scene"
description = "NSH 游戏引擎声明式场景：TSX 描述精灵，按 id 增量同步进 ECS"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nge-ai.workspace = true
nge-core.workspace = true
nge-ecs.workspace = true
nge-assets.workspace = true
nge-render2d.workspace = true
nge-render3d.workspace = true
nge-anim.workspace = true
nge-text.workspace = true
nge-particles.workspace = true
nge-physics2d.workspace = true
nge-physics3d.workspace = true
nge-audio.workspace = true
nge-net = { workspace = true, optional = true, features = ["ecs"] }
bevy_ecs.workspace = true
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[features]
default = ["physics3d", "ai", "net"]
# 3D 物理（rapier3d）和追击（寻路）的系统；不用的游戏关掉，浏览器上的包能小一些（见 docs/web.md）
physics3d = []
ai = []
# 联网（场景的 net，见 docs/networking.md）
net = ["dep:nge-net"]

[dev-dependencies]
nge-net = { workspace = true, features = ["ecs"] }
image.workspace = true
pollster.workspace = true
