[package]
name = "nge-relay"
default-run = "nge-relay"
description = "NSH 游戏引擎的中继服务：按房间转发 WebSocket 消息、权威房间、鉴权，顺带一个内存里的排行榜（HTTP）"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nge-relay"
path = "src/bin/nge-relay.rs"

[[bin]]
name = "nge-token"
path = "src/bin/nge-token.rs"

[dependencies]
nge-net.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# 排行榜名字的归属按 NFKC + 小写比
unicode-normalization = "0.1"

[dev-dependencies]
nge-net = { workspace = true, features = ["client"] }
