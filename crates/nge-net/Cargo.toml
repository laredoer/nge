[package]
name = "nge-net"
description = "NSH 游戏引擎联网：WebSocket 连接（原生 / 浏览器）、中继协议、远端插值、HTTP"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["client", "ecs"]
# 连接和 HTTP 的平台实现；中继只要协议，关掉
client = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
# ECS 插件（之后加）
ecs = ["client"]

[dependencies]
serde.workspace = true
postcard = { version = "1", default-features = false, features = ["use-std"] }
log.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event"] }

[[test]]
name = "link"
required-features = ["client"]
