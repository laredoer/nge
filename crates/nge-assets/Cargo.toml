[package]
name = "nge-assets"
description = "NSH 游戏引擎资源层：asset:/ 路径、后台加载、2D / 3D 共用的贴图"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
nge-core.workspace = true
nge-ecs.workspace = true
bevy_ecs.workspace = true
glam.workspace = true
image = { workspace = true, features = ["jpeg"] }
log.workspace = true
texture2ddecoder.workspace = true

[dev-dependencies]
texpresso.workspace = true
pollster.workspace = true
# 只编译、不运行：生成 mip 的着色器能不能转成 WebGL2 / GLES 的 GLSL
naga = { workspace = true, features = ["glsl-out"] }
